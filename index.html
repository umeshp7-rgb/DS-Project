<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canteen Orders – DSA Circular Queue Project</title>
<style>
:root{--bg:#fff4e0;--card:#fffdf7;--ink:#2b2418;--muted:#7b6b52;--line:#ead7b2;--accent:#d35400;--ok:#2e7d4f;--empty:#f3e6c9}
@media (prefers-color-scheme:dark){:root{--bg:#1d1810;--card:#272014;--ink:#f7eddb;--muted:#bda98a;--line:#463a24;--accent:#ff9f5a;--ok:#6fd195;--empty:#31281a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;padding:20px}
main{max-width:860px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.8rem;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#2c1500}}
button.alt{background:transparent;color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#msg{min-height:1.4em;margin:8px 0 0;color:var(--accent)}
.stats{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);margin-bottom:10px}.stats b{color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.slot{border:2px dashed var(--line);border-radius:8px;padding:8px;min-height:84px;background:var(--empty);font-size:.85rem}
.slot.full{border-style:solid;border-color:var(--muted);background:var(--bg)}
.slot .ix{color:var(--muted);font-size:.72rem}
.slot b{display:block;word-break:break-word}
.slot .t{font-size:.72rem;font-weight:700}
.slot.front{border-color:var(--ok)}.slot.front .t{color:var(--ok)}
.slot.rear{border-color:var(--accent)}.slot.rear .t{color:var(--accent)}
.slot.front.rear .t{color:var(--accent)}
.kitchen{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar{flex:1;min-width:160px;height:14px;background:var(--empty);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
.ready{display:flex;gap:8px;flex-wrap:wrap;min-height:34px}
.ready span{background:var(--ok);color:#fff;border-radius:16px;padding:2px 12px;font-weight:700}
@media (prefers-color-scheme:dark){.ready span{color:#06260f}}
#log{list-style:none;margin:0;padding:0;max-height:160px;overflow:auto;font:.85rem Consolas,monospace}
#log li{padding:3px 0;border-bottom:1px dashed var(--line)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .2s linear}}
</style>
</head>
<body>
<main>
<h1>College canteen order system</h1>
<p class="sub">Orders wait in a circular queue of 8 slots. The kitchen takes the oldest order first, and freed slots get reused.</p>

<section class="box">
<h2>Place an order</h2>
<div class="row">
<label>Student name <input id="who" maxlength="20" placeholder="Asha"></label>
<label>Item
<select id="item">
<option value="Veg biryani|5">Veg biryani</option>
<option value="Masala dosa|4">Masala dosa</option>
<option value="Samosa (2)|2">Samosa (2)</option>
<option value="Cold coffee|3" selected>Cold coffee</option>
<option value="Veg sandwich|3">Veg sandwich</option>
</select></label>
<button id="order">Place order</button>
</div>
<p id="msg" role="status"></p>
</section>

<section class="box">
<h2>Kitchen</h2>
<div class="kitchen">
<div id="cook" style="min-width:230px">Kitchen is idle</div>
<div class="bar" aria-hidden="true"><i id="fill"></i></div>
<button id="serve">Start next order</button>
</div>
<h2 style="margin-top:14px">Ready for pickup</h2>
<div class="ready" id="ready" aria-live="polite"></div>
</section>

<section class="box">
<div class="stats"><span>Waiting: <b id="sz">0</b> / 8</span><span>Front index: <b id="fi">–</b></span><span>Rear index: <b id="ri">–</b></span><span>Served: <b id="sv">0</b></span></div>
<div class="slots" id="slots"></div>
</section>

<section class="box"><h2>Operation log</h2><ul id="log"></ul></section>
</main>

<script>
// ---- Circular queue on a fixed-size array ----
class CircularQueue {
  constructor(cap){ this.cap = cap; this.data = new Array(cap).fill(null); this.front = 0; this.rear = -1; this.size = 0; }
  isFull(){ return this.size === this.cap; }
  isEmpty(){ return this.size === 0; }
  enqueue(x){                                   // O(1)
    if (this.isFull()) return false;
    this.rear = (this.rear + 1) % this.cap;      // wrap around to index 0 after the last slot
    this.data[this.rear] = x; this.size++; return true;
  }
  dequeue(){                                    // O(1)
    if (this.isEmpty()) return null;
    const x = this.data[this.front];
    this.data[this.front] = null;
    this.front = (this.front + 1) % this.cap;
    this.size--; return x;
  }
  peek(){ return this.isEmpty() ? null : this.data[this.front]; }
}

const q = new CircularQueue(8);
let token = 100, served = 0, cooking = false;
const $ = id => document.getElementById(id);
const say = t => $('msg').textContent = t;
function log(t){ const li = document.createElement('li'); li.textContent = new Date().toLocaleTimeString() + '  ' + t; $('log').prepend(li); }

function render(){
  $('sz').textContent = q.size; $('sv').textContent = served;
  $('fi').textContent = q.isEmpty() ? '–' : q.front;
  $('ri').textContent = q.isEmpty() ? '–' : q.rear;
  $('serve').disabled = cooking || q.isEmpty();
  const slots = $('slots'); slots.innerHTML = '';
  q.data.forEach((o, i) => {
    const d = document.createElement('div');
    const isFront = !q.isEmpty() && i === q.front, isRear = !q.isEmpty() && i === q.rear;
    d.className = 'slot' + (o ? ' full' : '') + (isFront ? ' front' : '') + (isRear ? ' rear' : '');
    const ix = document.createElement('div'); ix.className = 'ix'; ix.textContent = `slot ${i}`;
    d.append(ix);
    if (o){
      const b = document.createElement('b'); b.textContent = `#${o.token} ${o.who}`;
      const s = document.createElement('span'); s.textContent = o.item;
      d.append(b, s);
    } else { const e = document.createElement('span'); e.textContent = 'empty'; e.style.color = 'var(--muted)'; d.append(e); }
    const t = document.createElement('div'); t.className = 't';
    t.textContent = [isFront ? 'front' : '', isRear ? 'rear' : ''].filter(Boolean).join(' / ');
    d.append(t); slots.append(d);
  });
}

$('order').onclick = () => {
  const who = $('who').value.trim();
  if (!who){ say('Enter the student name.'); $('who').focus(); return; }
  const [item, mins] = $('item').value.split('|');
  const o = { token: ++token, who, item, secs: parseInt(mins, 10) };
  if (!q.enqueue(o)){ say('The order queue is full (8 orders). Start an order to free a slot.'); log(`queue full, rejected ${who}`); return; }
  say(`Order #${o.token} placed for ${who}: ${item}.`);
  log(`enqueue #${o.token} ${who} → slot ${q.rear}`);
  $('who').value = ''; $('who').focus(); render();
};

$('serve').onclick = () => {
  const slot = q.front, o = q.dequeue(); if (!o) return;
  cooking = true; log(`dequeue #${o.token} ${o.who} ← slot ${slot}, front moves to ${q.front}`);
  say(''); render();
  let t = 0;
  $('cook').textContent = `Preparing #${o.token} ${o.item} for ${o.who}`;
  $('fill').style.width = '0%';
  const timer = setInterval(() => {
    t++; $('fill').style.width = (t / o.secs * 100) + '%';
    if (t >= o.secs){
      clearInterval(timer); cooking = false; served++;
      $('cook').textContent = 'Kitchen is idle';
      const r = document.createElement('span'); r.textContent = `#${o.token}`; r.title = `${o.who}: ${o.item}`;
      $('ready').append(r);
      log(`order #${o.token} ready for pickup`);
      render();
    }
  }, 1000);
};
render();
</script>
</body>
</html>
